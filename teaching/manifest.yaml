# yaml-language-server: $schema=https://wandelbotsgmbh.github.io/catalog/schema.json
---
version: 0.1.1
name: Teaching (Beta)
novaOsVersion: ">= 26.7"
supportsCloud: true
beta: true
description: |
    Teach and edit poses, jog robots and run programs in the browser.
    The Robot Interface as a standalone NOVA app: 3D robot view, poses/frames
    tree, jogging, routines and dataset loading.
homepage: https://github.com/wandelbotsgmbh
app:
    name: teaching
    appIcon: icon.png
    containerImage:
        image: wandelbots.azurecr.io/nova-apps/teaching:0.1.1
        secrets:
            - name: pull-secret-wandelbots-azurecr-io
    port: 3000
