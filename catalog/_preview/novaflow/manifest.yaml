# yaml-language-server: $schema=https://wandelbotsgmbh.github.io/catalog/schema.json
---
version: 2026.6.80
# name and app.name must match the catalog folder name ("novaflow"): the NOVA
# app store identifies entries by the autogenerated catalog.yaml name (= folder)
# and matches it against the installed app name for the installed-state and the
# post-install Running poll. A mismatch makes the install dialog spin for the
# full 120s timeout and the app never show as installed.
name: novaflow
novaOsVersion: ">= 25.3"
supportsCloud: true
description: |
    NovaFlow is a visual programming tool that allows users to create automation
    workflows using a drag-and-drop interface.
homepage: https://wandelbots.com
app:
    name: novaflow
    appIcon: "static/app_icon.png"
    environment:
        - name: PORT
          value: "8000"
    containerImage:
        image: wandelbots.azurecr.io/apps/novaflow-installer:2026.6.80
        secrets:
            - name: pull-secret-wandelbots-azurecr-io
    port: 8000
