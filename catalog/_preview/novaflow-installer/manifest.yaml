# yaml-language-server: $schema=https://catalog.wandelbots.io/schema.json
---
version: 2026.7.3
# The folder name, this name, and app.name must all be "novaflow-installer":
# the NOVA app store identifies entries by the autogenerated catalog.yaml name
# (= folder) and matches it against the installed app name for the
# installed-state and the post-install Running poll — a mismatch makes the
# install dialog spin for its full 120s timeout and the app never show as
# installed. Do NOT shorten the app name to "novaflow": the app platform
# creates a helm release named after the app in the cell namespace, and
# "novaflow" collides with the release name of a standalone novaflow
# (skaffold/helm) deployment — the operator would hijack and destroy it.
name: novaflow-installer
novaOsVersion: ">= 25.3"
supportsCloud: true
description: |
    NovaFlow is a visual programming tool that allows users to create automation
    workflows using a drag-and-drop interface.
homepage: https://wandelbots.com
app:
    name: novaflow-installer
    appIcon: "static/app_icon.png"
    environment:
        - name: PORT
          value: "8000"
    containerImage:
        image: wandelbots.azurecr.io/ba/novaflow/novaflow-installer:2026.7.3
        secrets:
            - name: pull-secret-wandelbots-azurecr-io
    port: 8000
    # Probe target: the app platform wires k8s startup/readiness/liveness
    # probes to <urlPath>/health, so the pod only counts as Ready once the
    # server actually responds (no gateway-error window after install).
    healthPath: "health"
