# yaml-language-server: $schema=../../schema.json
---
version: 0.9.0
name: robot-customizer
beta: true
supportsCloud: true
description: |
  Robot Customizer lets you browse the motion group (robot) models available on
  a Nova instance, fetch their model archives, and customize / re-export them
  as new, ready-to-use robot models.
homepage: https://code.wabo.run/robotics/robot-customizer
app:
  name: robot-customizer
  appIcon: icon.png
  containerImage:
    image: wandelbots.azurecr.io/nova-apps/robot-customizer:0.9.0
    secrets:
      - name: pull-secret-wandelbots-azurecr-io
  port: 3000
